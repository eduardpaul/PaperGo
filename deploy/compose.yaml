name: papergo

services:
  papergo:
    image: ghcr.io/eduardpaul/papergo:${PAPERGO_VERSION:-latest}
    ports:
      - "${PAPERGO_BIND:-127.0.0.1}:${PAPERGO_PORT:-8080}:8080"
    environment:
      AUTH_MODE: local
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
    secrets: [admin-password]
    volumes:
      - papergo-data:/data
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

volumes:
  papergo-data: {}

secrets:
  admin-password:
    file: ./secrets/admin-password
