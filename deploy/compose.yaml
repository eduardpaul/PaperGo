name: papergo

services:
  papergo:
    image: ghcr.io/eduardpaul/papergo:${PAPERGO_VERSION:-latest}
    ports:
      - "${PAPERGO_BIND:-127.0.0.1}:${PAPERGO_PORT:-8080}:8080"
    environment:
      AUTH_MODE: local
      ADMIN_PASSWORD_FILE: /run/secrets/admin-password
      # With the papergo-mcp service below, tells the web app where AI
      # assistants connect, so Settings → AI assistants offers connections.
      # MCP_PUBLIC_URL: http://localhost:${PAPERGO_MCP_PORT:-8090}/v1/mcp
    secrets: [admin-password]
    volumes:
      - papergo-data:/data
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # The optional MCP server, which lets AI assistants use PaperGo with a
  # person's access token (docs/mcp.md). Uncomment it and MCP_PUBLIC_URL
  # above to serve it at http://localhost:8090/v1/mcp; behind a reverse
  # proxy, route /v1/mcp to it instead of publishing a port and set both
  # public URLs to that address.
  # papergo-mcp:
  #   image: ghcr.io/eduardpaul/papergo-mcp:${PAPERGO_VERSION:-latest}
  #   ports:
  #     - "${PAPERGO_BIND:-127.0.0.1}:${PAPERGO_MCP_PORT:-8090}:8081"
  #   environment:
  #     PAPERGO_MCP_BACKEND_URL: http://papergo:8080
  #     PAPERGO_MCP_APP_URL: http://localhost:${PAPERGO_PORT:-8080}
  #   depends_on: [papergo]
  #   read_only: true
  #   cap_drop: [ALL]
  #   security_opt: [no-new-privileges:true]
  #   restart: unless-stopped

volumes:
  papergo-data: {}

secrets:
  admin-password:
    file: ./secrets/admin-password
