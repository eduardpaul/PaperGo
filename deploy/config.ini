# Sample configuration shipped beside the PaperGo executable.
# Environment variables override these keys when they are set.

[server]
port = 8080
bind = 0.0.0.0
data_dir = ./data
public_url = http://localhost:8080

[auth]
mode = local
admin_user = admin
admin_password = admin

[search]
store = zvec
zvec_path = ./data/search/zvec

[storage]
blob_path = ./data/blobs
max_upload_mb = 100
