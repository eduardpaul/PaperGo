# Sample configuration shipped beside the PaperGo executable.
# Non-empty environment variables override the matching settings.

server:
  port: 8080
  bind: 0.0.0.0
  data_dir: ./data
  public_url: http://localhost:8080

# AI assistants connect at /v1/mcp with a personal access token, made under
# Settings, AI assistants. To turn the endpoint off:
# mcp:
#   enabled: false

# PostgreSQL instead of the SQLite file in data_dir:
# database:
#   url: postgres://papergo:secret@localhost:5432/papergo

auth:
  mode: local
  admin_user: admin
  admin_password: admin

# Search keeps its index beside the database: a SQLite file next to the
# SQLite database, or a schema of the PostgreSQL database. To choose
# (sqlite, postgres or none, which runs without search):
# search:
#   store: none

# Discussions on items: "on" (the default) or "off". Off keeps existing
# comments but serves none of them; organizations, workspaces and
# collections turn comments on and off in the app.
comments: "on"

storage:
  blob_path: ./data/blobs
  max_upload_mb: 100
  # Largest Markdown or text file edited in the browser; larger files open
  # read-only. At most max_upload_mb.
  edit_max_mb: 2

# Operation workers. Each named worker runs its own kinds of background
# work; settings left out keep the defaults. Workers:
#   maintenance   index builds, bulk edits, package export and import
#   integrations  list integration refreshes, two at a time
#   documents     text reads and OCR, Photos to PDF
#   previews      file previews
#   ai            AI completions, two at a time (only with a chat model)
#   ai-batch      batch AI completions, in groups of 20 or at 01:00 UTC
#                 (only with a batch provider)
#   decisions     local workflow and taxonomy decisions (only with the
#                 decision engine)
#   workflows     workflow runs, four slices at a time
#   search        file content chunking, embedding and publishing, embedding
#                 sweeps and search reindex (only with search)
#   search-sync   writing changed entries to the index, up to 200 at a time
#                 (only with search)
# workers:
#   documents:
#     concurrency: 2
#     window:          # start new work only overnight
#       time_zone: Europe/Madrid
#       from: "22:00"
#       to: "06:00"
