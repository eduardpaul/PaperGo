name: Native SDKs
description: Install the pinned cgo SDKs and export build/runtime paths
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: msys2/setup-msys2@v2
      id: msys2
      if: runner.os == 'Windows'
      with:
        msystem: UCRT64
        install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-ninja
    - name: Select the Windows GNU compiler
      if: runner.os == 'Windows'
      shell: bash
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        compiler_dir="$(cygpath -m "$MSYS2_LOCATION/ucrt64/bin")"
        test -x "$compiler_dir/gcc.exe"
        test -x "$compiler_dir/g++.exe"
        echo "$compiler_dir" >> "$GITHUB_PATH"
        echo "CC=$compiler_dir/gcc.exe" >> "$GITHUB_ENV"
        echo "CXX=$compiler_dir/g++.exe" >> "$GITHUB_ENV"
        echo 'CMAKE_GENERATOR=Ninja' >> "$GITHUB_ENV"
    - uses: dtolnay/rust-toolchain@1.90.0
      if: runner.os == 'Windows'
      with:
        targets: x86_64-pc-windows-gnu
    - uses: actions/cache@v4
      with:
        path: |
          .tools/native
          .tools/native-downloads
        key: native-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ hashFiles('.github/actions/native/action.yml', 'scripts/native.py', 'scripts/native.json', 'scripts/native-notices/**') }}
    - name: Install native SDKs
      shell: bash
      run: |
        python -m pip install cmake==3.31.10
        python scripts/native.py --github-env
