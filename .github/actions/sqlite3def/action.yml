name: sqlite3def
description: Install the pinned SQLite release schema planner on Linux or Windows amd64
runs:
  using: composite
  steps:
    - name: Install sqlite3def 3.11.26
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)
            archive=sqlite3def_linux_amd64.tar.gz
            checksum=7ef1cadbbaca6f12543c00edd3abe6b607ec69f30239517c47e36f86b580e378
            executable=sqlite3def
            ;;
          Windows/X64)
            archive=sqlite3def_windows_amd64.zip
            checksum=235d8a40f74dd56cc9997a6293f5f36241017a4450b698d6b3b7edc9bacaeb70
            executable=sqlite3def.exe
            ;;
          *)
            echo "Unsupported sqlite3def platform: $RUNNER_OS/$RUNNER_ARCH" >&2
            exit 1
            ;;
        esac
        install_dir="$RUNNER_TEMP/sqlite3def"
        if [[ "$RUNNER_OS" == Windows ]]; then
          install_dir="$(cygpath -m "$RUNNER_TEMP")/sqlite3def"
        fi
        mkdir -p "$install_dir"
        curl --fail --silent --show-error --location --retry 3 \
          "https://github.com/sqldef/sqldef/releases/download/v3.11.26/$archive" \
          --output "$install_dir/$archive"
        echo "$checksum  $install_dir/$archive" | sha256sum --check
        if [[ "$RUNNER_OS" == Windows ]]; then
          python -m zipfile -e "$install_dir/$archive" "$install_dir"
        else
          tar -xzf "$install_dir/$archive" -C "$install_dir"
        fi
        "$install_dir/$executable" --version
        echo "$install_dir" >> "$GITHUB_PATH"
