name: dependencies
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
jobs:
  govulncheck:
    name: Go dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build embedded frontend
        run: npm ci --prefix web && npm --prefix web run build
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan reachable dependencies
        run: govulncheck ./...
