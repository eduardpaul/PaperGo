name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or retry (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string
permissions:
  contents: read
# One publication at a time: each release extends the last published bundle.
concurrency:
  group: papergo-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  dependencies:
    uses: ./.github/workflows/vulnerabilities.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  prepare:
    needs: [verify, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      state: ${{ steps.metadata.outputs.state }}
      tag: ${{ steps.metadata.outputs.tag }}
      previous: ${{ steps.metadata.outputs.previous }}
      commit: ${{ steps.metadata.outputs.commit }}
      date: ${{ steps.metadata.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Check out release tooling from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          sparse-checkout: scripts
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/native
      - name: Validate tag and published history
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 release-tools/scripts/release-metadata.py
      - name: Download and verify the previous published database bundle
        if: steps.metadata.outputs.previous != ''
        env:
          PREVIOUS_TAG: ${{ steps.metadata.outputs.previous }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --pattern release-database.json --pattern SHA256SUMS --dir previous
          python3 scripts/release-checksum.py previous --verify release-database.json
          python3 -c 'import json,os; b=json.load(open("previous/release-database.json")); assert b["releases"][-1]["version"] == os.environ["PREVIOUS_TAG"]'
      - name: Generate and verify the release-only database upgrade
        if: steps.metadata.outputs.state != 'complete'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.previous }}
        run: |
          args=()
          if [[ -n "$PREVIOUS_TAG" ]]; then args+=(--previous previous/release-database.json); fi
          go run ./cmd/release --version "$RELEASE_TAG" "${args[@]}"
          mkdir -p release-assets
          cp migrations/release.json release-assets/release-database.json
      - uses: actions/upload-artifact@v4
        if: steps.metadata.outputs.state != 'complete'
        with:
          name: release-database
          path: release-assets/release-database.json
          if-no-files-found: error
          retention-days: 14
  build:
    needs: prepare
    if: needs.prepare.outputs.state != 'complete'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
          - {runner: macos-15, os: darwin, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/native
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-database
          path: release-assets
      - name: Build embedded UI and both standalone executables
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_DATE: ${{ needs.prepare.outputs.date }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
        run: |
          cp release-assets/release-database.json migrations/release.json
          npm ci --prefix web
          npm --prefix web run build
          mkdir -p bin
          suffix=''
          if [[ "$GOOS" == windows ]]; then suffix='.exe'; fi
          flags="-s -w -X papergo/internal/buildinfo.Version=$RELEASE_TAG -X papergo/internal/buildinfo.Commit=$RELEASE_COMMIT -X papergo/internal/buildinfo.Date=$RELEASE_DATE"
          go build -trimpath -ldflags="$flags" -o "bin/papergo$suffix" ./cmd/api
          go build -trimpath -ldflags="$flags" -o "bin/papergo-admin$suffix" ./cmd/admin
      - name: Package binaries, database bundle and operator guide
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python scripts/release-package.py --version "$RELEASE_TAG" --os "$RELEASE_OS" --arch "$RELEASE_ARCH"
      - name: Native binary startup and database smoke test
        shell: bash
        run: python scripts/release-smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.state != 'complete'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Check out release tooling from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-database
          path: dist
      - name: Write asset checksums
        run: python3 scripts/release-checksum.py dist
      - name: Publish prepared assets or finish an empty existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous }}
        run: python3 release-tools/scripts/release-metadata.py --publish dist
