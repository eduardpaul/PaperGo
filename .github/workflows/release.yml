name: release
# Builds, tests and publishes a version tag. The tag must name a commit
# whose verify run on main succeeded; the release does not run CI again.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string
permissions:
  contents: read
# One publication at a time: release notes start at the last published tag.
concurrency:
  group: papergo-release
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/eduardpaul/papergo
  MCP_IMAGE: ghcr.io/eduardpaul/papergo-mcp
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      previous: ${{ steps.metadata.outputs.previous }}
      commit: ${{ steps.metadata.outputs.commit }}
      date: ${{ steps.metadata.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Check the tag, its verification on main and the published history
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-metadata.py
  assets:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/cache@v4
        with:
          path: |
            .tools/decision/model
            .tools/embedding/models
          key: presets-${{ hashFiles('internal/decision/manifest.json', 'scripts/decision-model/bundle.json', 'scripts/fetch-embedding-models.py') }}
      - name: Package shared models and assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/build-assets.py --output-dir shared/assets --archive "dist/papergo_${RELEASE_TAG}_assets.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: container-assets
          path: shared
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: shared-assets
          path: dist/*_assets.zip
          if-no-files-found: error
          retention-days: 14
  build:
    needs: [prepare, assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
          # - {runner: macos-15, os: darwin, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: ./.github/actions/toolchain
      - name: Build embedded UI, executables and native libraries
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_DATE: ${{ needs.prepare.outputs.date }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
        run: |
          npm ci --prefix web
          npm --prefix web run build
          flags="-s -w -X papergo/internal/buildinfo.Version=$RELEASE_TAG -X papergo/internal/buildinfo.Commit=$RELEASE_COMMIT -X papergo/internal/buildinfo.Date=$RELEASE_DATE"
          python scripts/build-binaries.py --ldflags="$flags"
      - name: Package binaries and operator guide
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python scripts/release-package.py --version "$RELEASE_TAG" --os "$RELEASE_OS" --arch "$RELEASE_ARCH"
      - uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: shared-assets
      - name: Native binary startup and database smoke test
        shell: bash
        run: python scripts/release-smoke.py --assets shared-assets/papergo_${{ needs.prepare.outputs.tag }}_assets.zip
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  # Each platform's image is pushed by digest and tested; image-publish tags
  # the tested digests once the GitHub release exists.
  image:
    needs: [prepare, assets]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          name: container-assets
          path: container-assets
      - name: Give the model layer reproducible timestamps
        run: find container-assets -exec touch -h -d @0 {} +
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker-container
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build an image by digest
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          build-contexts: model-assets=./container-assets
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            BUILD_DATE=${{ needs.prepare.outputs.date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.arch }}
      - name: Pull and test the image
        env:
          CANDIDATE: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker pull "$CANDIDATE"
          python3 scripts/docker-smoke.py --image "$CANDIDATE" --version "$RELEASE_TAG"
      - name: Record the tested digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: mkdir -p digests && echo "$DIGEST" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: dist
      - name: Write asset checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous }}
        run: python3 scripts/release-metadata.py --publish dist
  # Stable releases also move latest; release candidates keep only their tag.
  image-publish:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the tested multi-platform image
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          tags=(--tag "$IMAGE:$RELEASE_TAG")
          if [[ $RELEASE_TAG != *-rc.* ]]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" \
            --annotation "index:org.opencontainers.image.version=$RELEASE_TAG" \
            --annotation "index:org.opencontainers.image.revision=$RELEASE_COMMIT" \
            --annotation "index:org.opencontainers.image.source=$SOURCE_URL" \
            "$IMAGE@$(cat digests/amd64)" "$IMAGE@$(cat digests/arm64)"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"
  # papergo-mcp's own image: pure Go, cross-compiled for both platforms in
  # one build, tested, then tagged like the main image.
  mcp-image:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker-container
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build an image by digest
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: extensions/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            BUILD_DATE=${{ needs.prepare.outputs.date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.MCP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-mcp-image
          cache-to: type=gha,mode=max,scope=release-mcp-image
      - name: Test and tag the image
        env:
          CANDIDATE: ${{ env.MCP_IMAGE }}@${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker run --rm --platform linux/amd64 "$CANDIDATE" --version | grep -F "$RELEASE_TAG"
          tags=(--tag "$MCP_IMAGE:$RELEASE_TAG")
          if [[ $RELEASE_TAG != *-rc.* ]]; then tags+=(--tag "$MCP_IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "$CANDIDATE"
