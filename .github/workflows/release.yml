name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or retry (vX.Y.Z or vX.Y.Z-rc.N)
        required: true
        type: string
permissions:
  contents: read
# One publication at a time: each release extends the last published bundle.
concurrency:
  group: papergo-release
  cancel-in-progress: false
jobs:
  verify:
    # Publishes the CI toolchain image when the tag's inputs are new.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
  prepare:
    permissions:
      contents: write
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      state: ${{ steps.metadata.outputs.state }}
      tag: ${{ steps.metadata.outputs.tag }}
      previous: ${{ steps.metadata.outputs.previous }}
      commit: ${{ steps.metadata.outputs.commit }}
      date: ${{ steps.metadata.outputs.date }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Check out release tooling from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          sparse-checkout: scripts
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/native
      - uses: ./.github/actions/sqlite3def
      - name: Validate tag and published history
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: python3 release-tools/scripts/release-metadata.py
      - name: Download and verify the previous published database bundle
        if: steps.metadata.outputs.previous != ''
        env:
          PREVIOUS_TAG: ${{ steps.metadata.outputs.previous }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous
          gh release download "$PREVIOUS_TAG" --pattern release-database.json --pattern SHA256SUMS --dir previous
          python3 scripts/release-checksum.py previous --verify release-database.json
          python3 -c 'import json,os; b=json.load(open("previous/release-database.json")); assert b["releases"][-1]["version"] == os.environ["PREVIOUS_TAG"]'
      - name: Generate and verify the release-only database upgrade
        if: steps.metadata.outputs.state != 'complete'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          PREVIOUS_TAG: ${{ steps.metadata.outputs.previous }}
        run: |
          args=()
          if [[ -n "$PREVIOUS_TAG" ]]; then args+=(--previous previous/release-database.json); fi
          go run ./cmd/release --version "$RELEASE_TAG" "${args[@]}"
          mkdir -p release-assets
          cp internal/dal/migrations/release.json release-assets/release-database.json
      - name: Verify the published database bundle for image-only retries
        if: steps.metadata.outputs.state == 'complete'
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --pattern release-database.json --pattern SHA256SUMS --dir release-assets
          python3 scripts/release-checksum.py release-assets --verify release-database.json
          python3 -c 'import json,os; b=json.load(open("release-assets/release-database.json")); assert b["releases"][-1]["version"] == os.environ["RELEASE_TAG"]'
      - name: Commit or verify immutable database history before building
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.commit }}
          RELEASE_STATE: ${{ steps.metadata.outputs.state }}
        run: |
          args=()
          if [[ "$RELEASE_STATE" == 'complete' ]]; then args+=(--check); fi
          python3 scripts/release-migrations.py release-assets/release-database.json "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-database
          path: release-assets/release-database.json
          if-no-files-found: error
          retention-days: 14
  image-check:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.image.outputs.image }}
      state: ${{ steps.image.outputs.state }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check for an existing release image
        id: image
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-image.py check
  assets:
    needs: [prepare, image-check]
    if: needs.prepare.outputs.state != 'complete' || needs.image-check.outputs.state == 'missing'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: model-presets
          path: .tools
      - name: Package shared models and assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: python3 scripts/build-assets.py --output-dir shared/assets --archive "dist/papergo_${RELEASE_TAG}_assets.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: container-assets
          path: shared
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: shared-assets
          path: dist/*_assets.zip
          if-no-files-found: error
          retention-days: 14
  build:
    needs: [prepare, assets]
    if: needs.prepare.outputs.state != 'complete'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: amd64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64}
          - {runner: windows-2025, os: windows, arch: amd64}
          # - {runner: macos-15, os: darwin, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/native
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-database
          path: release-assets
      - name: Build embedded UI, executables and native libraries
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_DATE: ${{ needs.prepare.outputs.date }}
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
        run: |
          cp release-assets/release-database.json internal/dal/migrations/release.json
          npm ci --prefix web
          npm --prefix web run build
          flags="-s -w -X papergo/internal/buildinfo.Version=$RELEASE_TAG -X papergo/internal/buildinfo.Commit=$RELEASE_COMMIT -X papergo/internal/buildinfo.Date=$RELEASE_DATE"
          python scripts/build-binaries.py --ldflags="$flags"
      - name: Package binaries, database bundle and operator guide
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python scripts/release-package.py --version "$RELEASE_TAG" --os "$RELEASE_OS" --arch "$RELEASE_ARCH"
      - uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: shared-assets
      - name: Native binary startup and database smoke test
        shell: bash
        run: python scripts/release-smoke.py --assets shared-assets/papergo_${{ needs.prepare.outputs.tag }}_assets.zip
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  image-build:
    needs: [prepare, image-check, assets]
    if: needs.image-check.outputs.state == 'missing'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-database
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: container-assets
          path: container-assets
      - name: Embed the same database bundle as the release binaries
        run: |
          cp release-assets/release-database.json internal/dal/migrations/release.json
          find container-assets -exec touch -h -d @0 {} +
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          driver: docker-container
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build an OCI candidate by digest
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          pull: true
          build-contexts: model-assets=./container-assets
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            BUILD_DATE=${{ needs.prepare.outputs.date }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ needs.image-check.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.arch }}
      - name: Pull and test the exact candidate image
        env:
          IMAGE: ${{ needs.image-check.outputs.image }}@${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker pull "$IMAGE"
          python3 scripts/docker-smoke.py --image "$IMAGE" --version "$RELEASE_TAG"
      - name: Record the tested digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          python3 -c 'import os,pathlib; pathlib.Path("digests",os.environ["IMAGE_ARCH"]).write_text(os.environ["IMAGE_DIGEST"]+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [prepare, assets, build, image-check, image-build]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.state != 'complete' && needs.assets.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.image-build.result == 'success' || needs.image-check.outputs.state == 'existing')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - name: Check out release tooling from the workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-database
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: shared-assets
          path: dist
      - name: Write asset checksums
        run: python3 scripts/release-checksum.py dist
      - name: Publish prepared assets or finish an empty existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous }}
        run: python3 release-tools/scripts/release-metadata.py --publish dist
  image-publish:
    needs: [prepare, image-check, image-build, publish]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      needs.image-check.result == 'success' &&
      (needs.image-build.result == 'success' || needs.image-check.outputs.state == 'existing') &&
      (needs.publish.result == 'success' || needs.prepare.outputs.state == 'complete')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        if: needs.image-check.outputs.state == 'missing'
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested multi-platform release image
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-image.py publish
