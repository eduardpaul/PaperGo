name: backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Install Staticcheck
        # This upstream revision supports Go 1.27.2's export format.
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20261009230814-452d5bb86b45
      - name: Analyze code and tests
        run: staticcheck ./...
  docker-smoke:
    name: Docker build and startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Build image and smoke test
        run: bash scripts/docker-smoke.sh
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Verify module checksums
        run: go mod verify
      - name: Verify generated Ent code
        run: |
          go generate ./ent
          git diff --exit-code -- ent go.mod go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal ent/schema)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detection
        run: go test -race -count=1 -timeout=15m ./...
      - name: Build portable API
        run: CGO_ENABLED=0 go build -trimpath -o bin/papergo ./cmd/api
