name: verify
# Every job runs one stage of scripts/check.py; scripts/ci.sh runs the same
# stages locally in the same toolchain image. Pull requests run the lint and
# test stages. Pushes to main and the weekly schedule run the Go suite with
# the race detector instead of without it, and add real models, native
# search, packaging, the container image and the dependency scan. The weekly
# schedule and manual runs also run the native search soak and fuzzing and
# exercise the devcontainer. A release tag must name a commit this workflow
# passed on main.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly, for changes outside the repository: dependency advisories, model
  # downloads, runner and base images.
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: papergo-verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}
jobs:
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "image=ghcr.io/eduardpaul/papergo-ci:$(bash scripts/ci.sh tag)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: published
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.published.outputs.exists != 'true'
      - name: Build and publish the toolchain image
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: development
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

  lint:
    name: Lint
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: &postgres-dsn
      PAPERGO_TEST_POSTGRES_DSN: postgres://papergo:papergo@postgres:5432/papergo?sslmode=disable
    container: &toolchain
      image: ${{ needs.toolchain.outputs.image }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services: &postgres
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: papergo
          POSTGRES_PASSWORD: papergo
          POSTGRES_DB: papergo
        options: >-
          --health-cmd "pg_isready -U papergo -d papergo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Each kind of job keeps one cache per week and lockfile state, saved
      # by its first matrix entry on main when no exact match was restored.
      # Pull requests only read them.
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with: &caches
          path: &cache-paths |
            /home/vscode/go/pkg/mod
            /home/vscode/.cache
          key: &cache-key toolchain-${{ github.job }}-${{ hashFiles('go.sum', 'web/package-lock.json', 'sdk/package-lock.json') }}-${{ steps.week.outputs.week }}
          restore-keys: |
            toolchain-${{ github.job }}-${{ hashFiles('go.sum', 'web/package-lock.json', 'sdk/package-lock.json') }}-
            toolchain-${{ github.job }}-
      - run: python3 scripts/check.py lint --setup
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && strategy.job-index == 0 && steps.restore.outputs.cache-hit != 'true'
        with: &save-caches
          path: *cache-paths
          key: *cache-key

  test:
    name: Test (${{ matrix.name }})
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env: *postgres-dsn
    container: *toolchain
    services: *postgres
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: PostgreSQL, arguments: --only postgres }
          - { name: frontend, arguments: --only web }
    steps:
      - uses: actions/checkout@v4
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with: *caches
      - run: python3 scripts/check.py test ${{ matrix.arguments }} --setup
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && strategy.job-index == 0 && steps.restore.outputs.cache-hit != 'true'
        with: *save-caches
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ strategy.job-index }}
          path: .cache/checks
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Pull requests run the Go suite without the race detector, in two shards;
  # elsewhere the race job runs it instead. It reads the test job's cache.
  test-go:
    name: Test (Go ${{ matrix.shard }})
    if: github.event_name == 'pull_request'
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *toolchain
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: *cache-paths
          key: toolchain-test-${{ hashFiles('go.sum', 'web/package-lock.json', 'sdk/package-lock.json') }}-
          restore-keys: |
            toolchain-test-${{ hashFiles('go.sum', 'web/package-lock.json', 'sdk/package-lock.json') }}-
            toolchain-test-
      - run: python3 scripts/check.py test --only go --shard ${{ matrix.shard }} --setup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-go-reports-${{ strategy.job-index }}
          path: .cache/checks
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Everything below runs on main and weekly.
  race:
    name: Race (${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *toolchain
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with: *caches
      - run: python3 scripts/check.py race --shard ${{ matrix.shard }} --setup
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && strategy.job-index == 0 && steps.restore.outputs.cache-hit != 'true'
        with: *save-caches
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-reports-${{ strategy.job-index }}
          path: .cache/checks
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  models:
    name: Model presets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            .tools/decision/model
            .tools/embedding/models
          key: presets-${{ hashFiles('internal/decision/manifest.json', 'scripts/decision-model/bundle.json', 'scripts/fetch-embedding-models.py') }}
      - name: Prepare and verify all model presets
        run: python3 scripts/prepare-preset-models.py
      - uses: actions/upload-artifact@v4
        with:
          name: model-presets
          path: |
            .tools/decision/model
            .tools/embedding/models
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native:
    name: Native (${{ matrix.stage }})
    if: github.event_name != 'pull_request'
    needs: [toolchain, models]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: *toolchain
    strategy:
      fail-fast: false
      matrix:
        stage: [native, zvec, release, vuln]
    steps:
      - uses: actions/checkout@v4
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: restore
        uses: actions/cache/restore@v4
        with: *caches
      - uses: actions/download-artifact@v4
        with:
          name: model-presets
          path: .tools
      - run: python3 scripts/check.py ${{ matrix.stage }} --setup
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && strategy.job-index == 0 && steps.restore.outputs.cache-hit != 'true'
        with: *save-caches

  platforms:
    name: Native ${{ matrix.stage }} (${{ matrix.runner }})
    if: github.event_name != 'pull_request'
    needs: models
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS release builds are temporarily disabled.
          - { runner: windows-2025, stage: release }
          - { runner: ubuntu-24.04-arm, stage: zvec }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/toolchain
      - uses: actions/download-artifact@v4
        with:
          name: model-presets
          path: .tools
      - shell: bash
        run: python scripts/check.py ${{ matrix.stage }} --setup

  docker:
    name: Container image
    if: github.event_name != 'pull_request'
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model-presets
          path: .tools
      - run: python3 scripts/check.py docker

  # Long native search runs: the real-dimension soak and timed fuzzing.
  soak:
    name: Native search soak
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *toolchain
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check.py soak --setup

  # It builds the development image afresh, which the toolchain job already
  # builds and every container job uses, so it only runs weekly and on demand.
  devcontainer:
    name: Development container
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash .devcontainer/smoke-test.sh
