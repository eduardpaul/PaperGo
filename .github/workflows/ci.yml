name: verify
# Every job runs one stage of scripts/check.py; scripts/ci.sh runs the same
# stages locally in the same toolchain image. Pull requests run the lint and
# test stages. Pushes to main, the nightly schedule and releases also run the
# race suite, real models, native search, packaging, the container image,
# the devcontainer and the dependency scan.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: papergo-verify-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}
env:
  PAPERGO_TEST_POSTGRES_DSN: postgres://papergo:papergo@postgres:5432/papergo?sslmode=disable
jobs:
  toolchain:
    name: Toolchain image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: tag
        run: echo "image=ghcr.io/eduardpaul/papergo-ci:$(bash scripts/ci.sh tag)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: published
        run: |
          if docker manifest inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.published.outputs.exists != 'true'
      - name: Build and publish the toolchain image
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

  lint:
    name: Lint
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: &toolchain
      image: ${{ needs.toolchain.outputs.image }}
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services: &postgres
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: papergo
          POSTGRES_PASSWORD: papergo
          POSTGRES_DB: papergo
        options: >-
          --health-cmd "pg_isready -U papergo -d papergo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/cache@v4
        with: &caches
          path: |
            /home/vscode/go/pkg/mod
            /home/vscode/.cache/go-build
            /home/vscode/.cache/npm
          key: toolchain-${{ github.job }}-${{ hashFiles('go.sum', 'web/package-lock.json', 'sdk/package-lock.json') }}-${{ github.run_id }}
          restore-keys: toolchain-${{ github.job }}-${{ hashFiles('go.sum', 'web/package-lock.json', 'sdk/package-lock.json') }}-
      - run: python3 scripts/check.py lint --setup

  test:
    name: Test (${{ matrix.name }})
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *toolchain
    services: *postgres
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Go 1/2, arguments: --only go --shard 1/2 }
          - { name: Go 2/2, arguments: --only go --shard 2/2 }
          - { name: PostgreSQL, arguments: --only postgres }
          - { name: frontend, arguments: --only web }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/cache@v4
        with: *caches
      - run: python3 scripts/check.py test ${{ matrix.arguments }} --setup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ strategy.job-index }}
          path: .cache/checks
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Everything below runs on main, nightly and for releases.
  race:
    name: Race (${{ matrix.shard }})
    if: github.event_name != 'pull_request'
    needs: toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: *toolchain
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/cache@v4
        with: *caches
      - run: python3 scripts/check.py race --shard ${{ matrix.shard }} --setup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: race-reports-${{ strategy.job-index }}
          path: .cache/checks
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  models:
    name: Model presets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/cache@v4
        with:
          path: |
            .tools/decision/model
            .tools/embedding/models
          key: presets-${{ hashFiles('internal/decision/manifest.json', 'scripts/fetch-embedding-models.py') }}
      - name: Prepare and verify all model presets
        run: python3 scripts/prepare-preset-models.py
      - uses: actions/upload-artifact@v4
        with:
          name: model-presets
          path: |
            .tools/decision/model
            .tools/embedding/models
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native:
    name: Native (${{ matrix.stage }})
    if: github.event_name != 'pull_request'
    needs: [toolchain, models]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: *toolchain
    strategy:
      fail-fast: false
      matrix:
        stage: [native, zvec, release, vuln]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/cache@v4
        with: *caches
      - uses: actions/download-artifact@v4
        with:
          name: model-presets
          path: .tools
      - run: python3 scripts/check.py ${{ matrix.stage }} --setup

  platforms:
    name: Native ${{ matrix.stage }} (${{ matrix.runner }})
    if: github.event_name != 'pull_request'
    needs: models
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS release builds are temporarily disabled.
          - { runner: windows-2025, stage: release }
          - { runner: ubuntu-24.04-arm, stage: zvec }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          # The toolchain image pins the same Go for the other jobs.
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ./.github/actions/native
      - uses: ./.github/actions/sqlite3def
        if: matrix.stage == 'release'
      - uses: actions/download-artifact@v4
        with:
          name: model-presets
          path: .tools
      - shell: bash
        run: python scripts/check.py ${{ matrix.stage }} --setup

  docker:
    name: Container image
    if: github.event_name != 'pull_request'
    needs: models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: model-presets
          path: .tools
      - run: python3 scripts/check.py docker

  devcontainer:
    name: Development container
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash .devcontainer/smoke-test.sh
