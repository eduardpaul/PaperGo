name: backend
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify module checksums
        run: go mod verify
      - name: Verify generated Ent code
        run: |
          go generate ./ent
          git diff --exit-code -- ent go.mod go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal ent/schema)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detection
        run: go test -race -count=1 ./...
      - name: Build portable API
        run: CGO_ENABLED=0 go build -trimpath -o bin/papergo ./cmd/api
