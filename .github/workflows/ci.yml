name: verify
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: papergo-verify-${{ github.workflow }}-${{ github.event_name }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')) }}
jobs:
  models:
    name: Prepare offline model presets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .tools/decision/model
            .tools/embedding/models
          key: presets-${{ hashFiles('internal/decision/manifest.json', 'scripts/fetch-embedding-models.py') }}
      - name: Prepare and verify all model presets
        run: python3 scripts/prepare-preset-models.py
      - uses: actions/upload-artifact@v4
        with:
          name: model-presets
          path: |
            .tools/decision/model
            .tools/embedding/models
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  frontend:
    name: Build embedded frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and typecheck
        run: npm ci --prefix web && npm --prefix web run build
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-frontend
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  devcontainer:
    name: Development container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Build and smoke test the development environment
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash .devcontainer/smoke-test.sh
  staticcheck:
    needs: frontend
    name: Staticcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/native
      - uses: actions/download-artifact@v4
        with:
          name: embedded-frontend
          path: web/dist
      - name: Install Staticcheck
        # This upstream revision supports Go 1.27.2's export format.
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0-0.dev.0.20261009230814-452d5bb86b45
      - name: Analyze code and tests
        run: staticcheck ./...
  docker-smoke:
    needs: models
    name: Docker build and startup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: model-presets
          path: .tools
      - name: Build image and test production startup and persistence
        run: |
          python3 scripts/build-assets.py --output-dir container-assets/assets
          docker build --build-context model-assets=./container-assets --tag papergo:ci-smoke .
          python3 scripts/docker-smoke.py --image papergo:ci-smoke
  verify:
    needs: [frontend, models]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/native
      - uses: ./.github/actions/sqlite3def
      - uses: actions/download-artifact@v4
        with:
          name: embedded-frontend
          path: web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check frontend
        run: npm ci --prefix web && npm --prefix web run lint && npm --prefix web test -- --maxWorkers=2
      - name: Check verification and release scripts
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check NPM sample setup
        run: python3 -m unittest discover -s samples/npm -p 'test_*.py' -v
      - name: Check authentik sample setup
        run: python3 -m unittest discover -s samples/authentik -p 'test_*.py' -v
      - name: Verify module checksums
        run: go mod verify
      - name: Verify generated Ent code
        run: |
          go generate ./ent
          git diff --exit-code -- ent go.mod go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal ent/schema web/*.go)"
      - name: Vet
        run: go vet ./...
      - uses: actions/download-artifact@v4
        with:
          name: model-presets
          path: .tools
      - name: Build application
        run: |
          python scripts/build-binaries.py
          python scripts/build-assets.py
          python scripts/release-smoke.py --bin-dir bin
  embeddings:
    name: Local embedding engines
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/native
      - uses: actions/cache@v4
        with:
          path: .tools/embedding/models
          key: embedding-q4-daa72c51243991df-e4daffa011e666dc
      - name: Install pinned runtimes and text models
        run: |
          python3 scripts/fetch-embedding-models.py all
          echo "EMBEDDING_MODELS_ROOT=$PWD/.tools/embedding/models" >> "$GITHUB_ENV"
      - name: Check native embeddings, cancellation and shared OCR runtime
        env:
          PAPERGO_REQUIRE_EMBEDDING: '1'
        run: go test -race ./internal/embedding ./internal/onnx ./cmd/embed
  race:
    needs: frontend
    name: Race tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/native
      - uses: ./.github/actions/sqlite3def
      - uses: actions/download-artifact@v4
        with:
          name: embedded-frontend
          path: web/dist
      - name: Test with race detection
        env:
          PAPERGO_REQUIRE_OCR: '1'
        run: python3 scripts/test-race.py --shard ${{ matrix.shard }} --shards 3
      - name: Upload race test timings and events
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-timings-${{ matrix.shard }}
          path: .cache/checks/race-${{ matrix.shard }}.*
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  zvec:
    needs: frontend
    name: Native zvec (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/native
      - uses: actions/download-artifact@v4
        with:
          name: embedded-frontend
          path: web/dist
      - name: Native conformance, lifecycle, backup and offline copy
        run: go test -race ./internal/search/zvecstore ./internal/backup ./cmd/admin
      - name: Service, HTTP and workflow parity
        env:
          PAPERGO_TEST_SEARCH_STORE: zvec
        run: go test -race ./internal/dms ./internal/httpapi ./internal/runner -run '(Search|Content|Receipt|Contract|AIComplete|Prefix|SmartFolder|View|Listing|Query)'
      - name: Real dimensions soak
        env:
          PAPERGO_ZVEC_SOAK: '1'
        run: go test ./internal/search/zvecstore -run '^TestRealDimensionsSoak$' -count=1 -v
      - name: Fuzz native query builders
        run: |
          go test ./internal/search/zvecstore -run '^$' -fuzz '^FuzzNativeFilter$' -fuzztime=10s -parallel=2
          go test ./internal/search/zvecstore -run '^$' -fuzz '^FuzzNativeText$' -fuzztime=10s -parallel=2
      - uses: actions/upload-artifact@v4
        with:
          name: zvec-${{ runner.os }}-${{ runner.arch }}
          path: .tools/native/installed.json

  native-platforms:
    needs: [frontend, models]
    name: Native SDK smoke (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          # - macos-15
          - windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - uses: ./.github/actions/native
      - uses: ./.github/actions/sqlite3def
      - uses: actions/download-artifact@v4
        with:
          name: embedded-frontend
          path: web/dist
      - name: Build executables
        shell: bash
        run: |
          go build ./cmd/api ./cmd/admin ./cmd/embed ./cmd/ocr
      - name: Exercise native search, PDFs, images and OCR
        shell: bash
        run: go test ./internal/onnx ./internal/ocr/paddle ./internal/imaging ./internal/doctext/pdfium ./internal/search/zvecstore -run 'TestNativeABI|TestReadAndRender|TestRecognize$|TestDecode|TestWebPRoundTripAndResize|TestIdle|TestConcurrentIdle'
      - uses: actions/download-artifact@v4
        with:
          name: model-presets
          path: .tools
      - name: Verify the packaged executable and library paths
        shell: bash
        run: |
          go run ./cmd/release --version v0.0.0-rc.1
          python scripts/build-binaries.py --ldflags='-s -w -X papergo/internal/buildinfo.Version=v0.0.0-rc.1'
          python scripts/build-assets.py --archive dist/papergo_v0.0.0-rc.1_assets.zip
          python scripts/release-package.py --version v0.0.0-rc.1 --os "$(go env GOOS)" --arch "$(go env GOARCH)"
          python scripts/release-smoke.py --assets dist/papergo_v0.0.0-rc.1_assets.zip
